name: Build OAF

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk git gettext libssl-dev xsltproc rsync wget unzip python3 curl zstd

      - name: Download OpenWrt SDK
        run: |
          set -e

          SDK_FILE=$(curl -fsSL https://downloads.openwrt.org/releases/24.10.2/targets/ipq40xx/chromium/ \
            | grep -oE 'openwrt-sdk-[^"]+\.tar\.(zst|xz)' | head -n 1)

          if [ -z "$SDK_FILE" ]; then
            echo "SDK not found"
            exit 1
          fi

          echo "Found SDK: $SDK_FILE"
          wget -q "https://downloads.openwrt.org/releases/24.10.2/targets/ipq40xx/chromium/$SDK_FILE"

          mkdir -p sdk
          tar -xf "$SDK_FILE" -C sdk --strip-components=1

      - name: Clone OAF Repo
        run: |
          cd sdk
          git clone https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter

      - name: Compile OAF
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_luci-app-oaf=y" >> .config
          echo "CONFIG_PACKAGE_open-app-filter=y" >> .config
          echo "CONFIG_PACKAGE_kmod-oaf=y" >> .config
          make defconfig
          make package/OpenAppFilter/compile V=s -j"$(nproc)"

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: oaf-ipk-24.10.2
          path: sdk/bin/**/*.ipk
