name: Build OAF

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk git gettext libssl-dev xsltproc rsync wget unzip python3 curl

      - name: Download OpenWrt SDK
        run: |
          SDK_FILENAME=$(curl -s https://downloads.openwrt.org/releases/24.10.2/targets/ipq40xx/chromium/ | grep -o 'openwrt-sdk-[^"]*\.tar\.xz' | head -n 1)
          echo "Found SDK: $SDK_FILENAME"
          wget "https://downloads.openwrt.org/releases/24.10.2/targets/ipq40xx/chromium/$SDK_FILENAME"
          tar -xf openwrt-sdk-*.tar.xz
          mv openwrt-sdk-* sdk

      - name: Clone OAF Repo
        run: |
          cd sdk
          git clone https://github.com/destan19/OpenAppFilter.git package/oaf

      - name: Compile OAF
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          echo "CONFIG_PACKAGE_luci-app-oaf=y" >> .config
          make package/oaf/compile V=s -j$(nproc)

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: oaf-ipk
          path: sdk/bin/packages/arm_cortex-a7_neon-vfpv4/base/*.ipk
